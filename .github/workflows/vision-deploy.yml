name: VISION manual Azure deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vision-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.VISION_AZURE_CREDENTIALS }}
      - name: Upload only to VISION preview account
        env:
          STORAGE_ACCOUNT: ${{ vars.VISION_AZURE_STORAGE_ACCOUNT }}
        run: |
          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "Missing VISION_AZURE_STORAGE_ACCOUNT environment variable" >&2
            exit 1
          fi
          az storage blob upload-batch --account-name "$STORAGE_ACCOUNT" --destination '$web' --source dist --auth-mode login --overwrite true
          az storage blob update --account-name "$STORAGE_ACCOUNT" --container-name '$web' --name index.html --content-cache-control 'no-cache' --auth-mode login
